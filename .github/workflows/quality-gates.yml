name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Resolve format baseline
        id: format-baseline
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) format_base="$PR_BASE_SHA" ;;
            push) format_base="$PUSH_BASE_SHA" ;;
            *) format_base="" ;;
          esac

          if [[ -z "$format_base" || "$format_base" =~ ^0+$ ]] || ! git cat-file -e "${format_base}^{commit}" 2>/dev/null; then
            format_base="$(git rev-parse HEAD^)"
          fi

          echo "sha=$format_base" >> "$GITHUB_OUTPUT"
      - name: Format changed files against baseline
        run: pnpm exec biome format --changed --since=${{ steps.format-baseline.outputs.sha }} --no-errors-on-unmatched
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Legacy fixtures concatenate a Windows separator to os.tmpdir(). Keep
    # their isolated directories under /tmp until those fixtures are portable.
    env:
      TMPDIR: /tmp/.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMPDIR: /tmp/.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm packages:build
      # The integration global setup starts isolated PostgreSQL and Redis
      # Testcontainers, applies database/migrations, and tears them down.
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodeprox
          POSTGRES_USER: nodeprox
          POSTGRES_PASSWORD: nodeprox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodeprox -d nodeprox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nodeprox:nodeprox@127.0.0.1:5432/nodeprox
      REDIS_URL: redis://127.0.0.1:6379
      STORAGE_PROVIDER: filesystem
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm packages:build
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright starts/stops the Web and e2e-backend processes; the latter
      # applies migrations and owns its API, Worker and upload mock lifecycle.
      - run: pnpm test:e2e

  quality-gates:
    if: ${{ always() }}
    needs: [static, unit, integration, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
