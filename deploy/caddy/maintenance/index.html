<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>NodeProx · Mantenimiento</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0d1118;
        --surface: #171d27;
        --border: #2c3442;
        --text: #f3f5fb;
        --muted: #a9b2c2;
        --primary: #7c5cff;
        --primary-soft: #241d45;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(124, 92, 255, 0.16), transparent 34%),
          var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(28px, 6vw, 52px);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(145deg, rgba(23, 29, 39, 0.98), rgba(16, 21, 29, 0.98));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        text-align: center;
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(124, 92, 255, 0.55);
        border-radius: 18px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 30px;
        font-weight: 800;
      }

      h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -0.03em; }
      p { margin: 14px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
      .brand { margin-top: 30px; color: var(--muted); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main aria-labelledby="maintenance-title">
      <div class="mark" aria-hidden="true">N</div>
      <h1 id="maintenance-title">NodeProx está temporalmente en mantenimiento</h1>
      <p>Estamos aplicando mejoras al sistema.</p>
      <p>Vuelve a intentarlo en unos momentos.</p>
      <div class="brand">NodeProx</div>
    </main>
  </body>
</html>
